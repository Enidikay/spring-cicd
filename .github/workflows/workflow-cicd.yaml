name: Workflow CICD
run-name: Workflow CICD

on:
  push:
    branches: ["main"]

jobs:
  analyse:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v5

      - name: Configurer Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v5
        with:
          languages: java-kotlin

      - name: Construire avec Maven
        run: mvn -B clean verify -Dspring.profiles.active=test

      - name: Sauvegarder le rapport JaCoCo
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: target/site/jacoco


      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v7