
name: Workflow CICD
run-name: Workflow CICD

on:
  push:
    branches: ["main"]

jobs:
  analyse:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v5

      - name: Configurer Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Construire avec Maven et lancer les tests
        run: mvn -B clean verify -Dspring.profiles.active=test

      - name: Générer le rapport Checkstyle
        if: ${{ always() }}
        run: mvn -B checkstyle:checkstyle

      - name: Sauvegarder le rapport JaCoCo
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Publier le rapport Checkstyle
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rapport-checkstyle
          path: target/site/
          if-no-files-found: warn

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4
